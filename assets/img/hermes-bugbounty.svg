<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">A careful bug bounty workflow with Hermes Agent</title>
  <desc id="desc">A glowing compass-like agent connects scope, testing, evidence, and human review on a dark technical background.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1130" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10182D"/>
      <stop offset="1" stop-color="#17243A"/>
    </linearGradient>
    <linearGradient id="glow" x1="476" y1="75" x2="754" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62E6C5"/>
      <stop offset="1" stop-color="#5C8DFF"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="matrix(0 180 -240 0 610 190)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3BC7C2" stop-opacity=".2"/>
      <stop offset="1" stop-color="#3BC7C2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#A8C3E8" stroke-opacity=".055"/>
    </pattern>
    <filter id="soft" x="420" y="30" width="380" height="320" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="24" fill="url(#halo)"/>
  <circle cx="610" cy="190" r="105" fill="#58DCC7" fill-opacity=".16" filter="url(#soft)"/>
  <path d="M118 190H1082" stroke="#84A5CF" stroke-opacity=".22" stroke-dasharray="5 9"/>
  <path d="M296 190H450M770 190H904" stroke="url(#glow)" stroke-width="2" stroke-dasharray="6 8"/>
  <circle cx="610" cy="190" r="93" fill="#111B31" stroke="url(#glow)" stroke-width="2"/>
  <circle cx="610" cy="190" r="76" stroke="#B4D2F0" stroke-opacity=".22"/>
  <path d="M610 126L628 184L610 176L592 184L610 126Z" fill="#62E6C5"/>
  <path d="M610 254L592 196L610 204L628 196L610 254Z" fill="#789CFF"/>
  <circle cx="610" cy="190" r="7" fill="#F4FBFF"/>
  <text x="610" y="287" fill="#DDEBFA" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="3">HERMES AGENT</text>
  <g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle">
    <rect x="74" y="144" width="222" height="92" rx="16" fill="#192942" stroke="#4E6B90" stroke-opacity=".65"/>
    <circle cx="112" cy="190" r="19" fill="#274262"/>
    <path d="M112 178L122 190L112 202L102 190L112 178Z" stroke="#78A9FF" stroke-width="2"/>
    <text x="193" y="184" fill="#8DA7C7" font-size="12" font-weight="600" letter-spacing="2">01 · BOUNDARY</text>
    <text x="193" y="207" fill="#F3F7FC" font-size="18" font-weight="700">Know the scope</text>
    <rect x="904" y="144" width="222" height="92" rx="16" fill="#192942" stroke="#4E6B90" stroke-opacity=".65"/>
    <circle cx="943" cy="190" r="19" fill="#274262"/>
    <path d="M934 190L941 197L953 183" stroke="#62E6C5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1034" y="184" fill="#8DA7C7" font-size="12" font-weight="600" letter-spacing="2">02 · EVIDENCE</text>
    <text x="1034" y="207" fill="#F3F7FC" font-size="18" font-weight="700">Prove, then report</text>
  </g>
  <g fill="#77E5CC">
    <circle cx="389" cy="190" r="4"/><circle cx="821" cy="190" r="4"/>
  </g>
  <text x="600" y="348" fill="#8FA7C5" font-family="Inter,Segoe UI,sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">A HUMAN-LED WORKFLOW FOR AUTHORIZED SECURITY RESEARCH</text>
</svg>
